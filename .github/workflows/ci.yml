name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npm run check
      - name: API smoke test
        run: |
          PORT=5000 NODE_ENV=production CLIENT_URL=http://localhost:5173 JWT_SECRET=ci-only-secret node server/server.js > /tmp/ecommerce-api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health; then
              curl --fail --silent http://127.0.0.1:5000/ | grep -q 'id="root"'
              exit $?
            fi
            sleep 1
          done
          cat /tmp/ecommerce-api.log
          exit 1
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix client
      - run: npm audit --omit=dev --audit-level=high --prefix server
